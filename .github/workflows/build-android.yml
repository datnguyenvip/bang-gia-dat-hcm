name: Build Android (APK + AAB)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ vars.APP_ID || 'com.datnguyen.giadathcm' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install & add platform
        run: |
          npm install
          sed -i "s/com.datnguyen.giadathcm/$APP_ID/" capacitor.config.json
          npx capacitor-assets generate --android --iconBackgroundColor '#0b6b4f' --assetPath assets || true
          npx cap add android
          npx capacitor-assets generate --android --assetPath assets || true
          npx cap sync android
      - name: Set SDK versions (min 24, compile/target 36)
        run: |
          sed -i -E 's/minSdkVersion *= *[0-9]+/minSdkVersion = 24/; s/compileSdkVersion *= *[0-9]+/compileSdkVersion = 36/; s/targetSdkVersion *= *[0-9]+/targetSdkVersion = 36/' android/variables.gradle
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          grep -n "SdkVersion" android/variables.gradle
          grep -q "minSdkVersion = 24" android/variables.gradle
          grep -q "targetSdkVersion = 36" android/variables.gradle
      - name: Set version
        run: |
          cd android/app
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -nE "versionCode|versionName|applicationId|minSdk" build.gradle
      - name: Build release (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p out
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          if [ -z "$KS_B64" ]; then
            echo "Không có keystore -> ký bằng debug keystore (chỉ để thử)"
            keytool -genkeypair -keystore dbg.jks -storepass android -keypass android -alias dbg -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=debug"
            KS=dbg.jks; KS_PASS=android; KEY_ALIAS=dbg; KEY_PASS=android
          else
            echo "$KS_B64" | base64 -d > release.jks; KS=release.jks
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
          $BT/apksigner sign --ks $KS --ks-pass pass:$KS_PASS --key-pass pass:$KEY_PASS --ks-key-alias $KEY_ALIAS --out out/GiaDatHCM.apk aligned.apk
          cp "$AAB" out/GiaDatHCM.aab
          jarsigner -keystore $KS -storepass $KS_PASS -keypass $KEY_PASS out/GiaDatHCM.aab $KEY_ALIAS
          rm -f release.jks dbg.jks
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: out/*
