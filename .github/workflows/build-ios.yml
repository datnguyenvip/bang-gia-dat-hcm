name: Build iOS (IPA)
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  ios:
    runs-on: macos-15
    env:
      EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install certificate & profile
        env:
          P12_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -e
          KC=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p tmp "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p tmp "$KC"
          echo "$P12_B64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k tmp "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          echo "$PROFILE_B64" | base64 --decode > $RUNNER_TEMP/p.mobileprovision
          security cms -D -i $RUNNER_TEMP/p.mobileprovision > $RUNNER_TEMP/p.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' $RUNNER_TEMP/p.plist)
          PNAME=$(/usr/libexec/PlistBuddy -c 'Print Name' $RUNNER_TEMP/p.plist)
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' $RUNNER_TEMP/p.plist)
          FULL=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' $RUNNER_TEMP/p.plist)
          BUNDLE=${FULL#*.}
          IDENT=$(security find-identity -v -p codesigning "$KC" | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/p.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          { echo "PNAME=$PNAME"; echo "TEAM=$TEAM"; echo "BUNDLE=$BUNDLE"; echo "IDENT=$IDENT"; } >> $GITHUB_ENV
          echo "Bundle ID láº¥y tá»« profile: $BUNDLE | Team: $TEAM | Cert: $IDENT"

      - name: Add iOS platform
        run: |
          npm install
          sed -i '' "s/com.datnguyen.giadathcm/$BUNDLE/" capacitor.config.json
          npx capacitor-assets generate --ios --assetPath assets || true
          npx cap add ios
          npx capacitor-assets generate --ios --assetPath assets || true
          npx cap sync ios
          cd ios/App
          ls
          if [ -f Podfile ]; then pod install; fi
          agvtool new-version -all ${{ github.run_number }} || true

      - name: Archive
        run: |
          # Scope signing to the app; CocoaPods frameworks cannot use its profile.
          ruby -r xcodeproj <<'RUBY'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app = project.targets.find { |target| target.name == 'App' }
          abort 'App target not found' unless app
          app.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('TEAM')
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PNAME')
            config.build_settings['CODE_SIGN_IDENTITY'] = ENV.fetch('IDENT')
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('BUNDLE')
          end
          project.save
          RUBY
          if [ -d ios/App/App.xcworkspace ]; then TARGET='-workspace ios/App/App.xcworkspace'; else TARGET='-project ios/App/App.xcodeproj'; fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive archive

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE</key><string>$PNAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath out

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: out/*.ipa

