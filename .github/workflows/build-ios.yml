name: Build iOS (IPA)
on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload the verified IPA to App Store Connect for TestFlight
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  ios:
    runs-on: macos-15
    env:
      EXPORT_METHOD: app-store-connect
    steps:
      - uses: actions/checkout@v4
      - name: Check App Store Connect credentials
        if: ${{ inputs.upload_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Select Xcode for TestFlight
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${SDK_VERSION%%.*}" -ge 26

      - name: Install certificate & profile
        env:
          P12_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -e
          KC=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p tmp "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p tmp "$KC"
          echo "$P12_B64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k tmp "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          echo "$PROFILE_B64" | base64 --decode > $RUNNER_TEMP/p.mobileprovision
          security cms -D -i $RUNNER_TEMP/p.mobileprovision > $RUNNER_TEMP/p.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' $RUNNER_TEMP/p.plist)
          PNAME=$(/usr/libexec/PlistBuddy -c 'Print Name' $RUNNER_TEMP/p.plist)
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' $RUNNER_TEMP/p.plist)
          FULL=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' $RUNNER_TEMP/p.plist)
          BUNDLE=${FULL#*.}
          IDENT=$(security find-identity -v -p codesigning "$KC" | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/p.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          { echo "PNAME=$PNAME"; echo "TEAM=$TEAM"; echo "BUNDLE=$BUNDLE"; echo "IDENT=$IDENT"; } >> $GITHUB_ENV
          echo "Bundle ID láº¥y tá»« profile: $BUNDLE | Team: $TEAM | Cert: $IDENT"

      - name: Add iOS platform
        run: |
          npm install
          sed -i '' "s/com.datnguyen.giadathcm/$BUNDLE/" capacitor.config.json
          npx capacitor-assets generate --ios --assetPath assets || true
          npx cap add ios
          npx capacitor-assets generate --ios --assetPath assets || true
          npx cap sync ios
          cd ios/App
          ls
          if [ -f Podfile ]; then pod install; fi
          agvtool new-version -all ${{ github.run_number }} || true

      - name: Archive
        run: |
          # Scope signing to the app; CocoaPods frameworks cannot use its profile.
          ruby -r xcodeproj <<'RUBY'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          app = project.targets.find { |target| target.name == 'App' }
          abort 'App target not found' unless app
          app.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('TEAM')
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PNAME')
            config.build_settings['CODE_SIGN_IDENTITY'] = ENV.fetch('IDENT')
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('BUNDLE')
          end
          project.save
          RUBY
          if [ -d ios/App/App.xcworkspace ]; then TARGET='-workspace ios/App/App.xcworkspace'; else TARGET='-project ios/App/App.xcodeproj'; fi
          xcodebuild $TARGET -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive archive

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/export.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE</key><string>$PNAME</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist -exportPath out

      - name: Verify TestFlight IPA
        run: |
          ditto -x -k out/*.ipa "$RUNNER_TEMP/ipa-check"
          APP=$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -name '*.app' -type d | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/exported-profile.plist"
          python3 - "$APP/Info.plist" "$RUNNER_TEMP/exported-profile.plist" <<'PY'
          import datetime, os, plistlib, sys
          with open(sys.argv[1], 'rb') as f:
              info = plistlib.load(f)
          with open(sys.argv[2], 'rb') as f:
              profile = plistlib.load(f)
          assert int(info['DTXcode']) >= 2600, 'Xcode 26+ required'
          assert int(info['DTSDKName'].removeprefix('iphoneos').split('.')[0]) >= 26, 'iOS SDK 26+ required'
          assert info['CFBundleIdentifier'] == os.environ['BUNDLE'], 'Bundle ID mismatch'
          assert not profile.get('ProvisionedDevices'), 'Development/ad hoc profile cannot be used for TestFlight'
          assert not profile.get('ProvisionsAllDevices'), 'Enterprise profile cannot be used for TestFlight'
          assert not profile['Entitlements'].get('get-task-allow', False), 'Debugging must be disabled'
          assert profile['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None), 'Profile expired'
          for key in ('CFBundleIdentifier', 'CFBundleShortVersionString', 'CFBundleVersion', 'DTXcode', 'DTSDKName'):
              print(f'{key}: {info[key]}')
          print('IPA signature, SDK and App Store distribution profile checks passed')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: ${{ inputs.upload_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          umask 077
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          xcrun altool --validate-app -f out/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f out/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

