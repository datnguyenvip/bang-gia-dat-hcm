name: Capture iPad App Store screenshots
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare iOS app
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          npm install
          npx cap add ios
          npx capacitor-assets generate --ios --assetPath assets
          npx cap sync ios
          if [ -f ios/App/Podfile ]; then (cd ios/App && pod install); fi
      - name: Build and capture actual iPad simulator
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); matches=[x for a in d["devices"].values() for x in a if "iPad Pro 13-inch" in x["name"]]; assert matches, "13-inch iPad simulator unavailable"; print(matches[0]["udid"])')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination "id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/ipad-build" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ipad-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ipad-build.log"; exit 1; }
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination "id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/ipad-build" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/ipad-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/ipad-build.log"; exit 1; }
          fi
          APP="$RUNNER_TEMP/ipad-build/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.datnguyen.giadathcm
          sleep 8
          mkdir -p screenshots
          xcrun simctl io "$DEVICE" screenshot screenshots/BangGiaDatHCM_iPad13_Home.png
          xcrun simctl list devices available > screenshots/simulator.txt
          printf 'Source commit: %s\nDevice: %s\nCapture: native iPad simulator running the Capacitor app\n' "$GITHUB_SHA" "$DEVICE" > screenshots/provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ipad-appstore-screenshots
          path: screenshots/
          if-no-files-found: error
